name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 月次データ更新（update.yml）が GITHUB_TOKEN でコミットした push は
  # 再帰防止のため push イベントを発火しない。そこで workflow_run で拾って自動デプロイする。
  workflow_run:
    workflows: ["Monthly CDC data refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_run 経由のときは、更新ジョブが成功したときだけデプロイ
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css _site/
          cp -r data _site/
          cp -r assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
